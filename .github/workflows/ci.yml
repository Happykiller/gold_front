name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 : le socle de test l'impose (jsdom charge undici, qui appelle
      # webidl.util.markAsUncloneable, apparue en Node 21) — et Node 20 est en
      # fin de vie depuis avril 2026. L'image de production a été alignée sur
      # la même version majeure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm ci` ne suffit pas : il n'écrit jamais le lockfile et tolère une
      # entrée orpheline — une dépendance retirée de package.json y reste
      # déclarée indéfiniment. `sass` y a survécu à deux migrations, jusqu'au
      # 11/08/2026 où un simple `npm install` l'a élaguée en 362 lignes.
      # `--package-lock-only` régénère le lockfile depuis package.json sans
      # toucher à node_modules : le diff dit si les deux ont divergé.
      - run: npm run lock:check

      - run: npm run lint

      # Confronte les requêtes écrites à la main au schéma du serveur, et
      # échoue si les types versionnés ne correspondent plus. C'est ce qui
      # transforme une dérive de l'API en erreur de CI, au lieu d'une page
      # blanche découverte en production.
      - run: npm run codegen:check

      - run: npm test

      # `build` enchaîne `tsc --noEmit` puis `vite build` : esbuild ne vérifie
      # pas les types, c'est tsc qui tient ce rôle.
      - run: npm run build
