name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 : le socle de test l'impose (jsdom charge undici, qui appelle
      # webidl.util.markAsUncloneable, apparue en Node 21) — et Node 20 est en
      # fin de vie depuis avril 2026. L'image de production a été alignée sur
      # la même version majeure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # `build` enchaîne `tsc --noEmit` puis `vite build` : esbuild ne vérifie
      # pas les types, c'est tsc qui tient ce rôle.
      - run: npm run build
